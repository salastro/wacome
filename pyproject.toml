[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wacome"
version = "0.1.1"
description = "A visual GUI for xsetwacom (X11 Wacom tablet configuration)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]
keywords = ["wacom", "xsetwacom", "tablet", "stylus", "pen", "x11", "multi-monitor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: Desktop Environment",
]

[project.urls]
Homepage = "https://github.com/salastro/wacome"
Issues = "https://github.com/salastro/wacome/issues"
Releases = "https://github.com/salastro/wacome/releases"

[project.scripts]
wacome = "wacome.__main__:main"

[tool.setuptools.packages.find]
include = ["wacome*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
