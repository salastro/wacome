[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wacome"
version = "0.1.0"
description = "A visual GUI for xsetwacom (X11 Wacom tablet configuration)"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]

[project.scripts]
wacome = "wacome.__main__:main"

[tool.setuptools.packages.find]
include = ["wacome*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
